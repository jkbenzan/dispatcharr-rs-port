<!-- Channel Manager: Resizable two-pane layout -->
<div class="split-pane">
  <!-- LEFT: Channels pane (self-contained) -->
  <div class="pane left" [style.width.%]="leftPaneWidth">
    <app-channels-pane (selectionChange)="onChannelSelectionChange($event)"></app-channels-pane>
  </div>

  <!-- TOOLBAR / DIVIDER -->
  <div class="toolbar-divider" 
       [class.expanded]="toolbarExpanded"
       [style.width.%]="toolbarExpanded ? 10 : null">
    
    <!-- Placeholder to align with pane headers -->
    <div class="toolbar-header-placeholder"></div>

    <!-- Drag handle (acts as divider when collapsed, left border when expanded) -->
    <div class="drag-handle" (mousedown)="onDividerMouseDown($event)" [class.collapsed-handle]="!toolbarExpanded">
      <div class="divider-handle" *ngIf="!toolbarExpanded"></div>
    </div>

    <!-- Collapsed state: Expand Button + quick-action icons -->
    <div class="collapsed-actions" *ngIf="!toolbarExpanded">
      <button class="toggle-btn collapsed-btn" (click)="toggleToolbar()">
        <span class="material-icons">chevron_right</span>
      </button>

      <!-- Create Channel — TV with plus sign -->
      <button class="quick-action-btn"
              (click)="openCreateChannelDialog()"
              title="Create Channel">
        <svg class="custom-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- TV body -->
          <rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <!-- TV stand -->
          <line x1="9" y1="21" x2="15" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Plus sign inside -->
          <line x1="12" y1="8.5" x2="12" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="9" y1="11.5" x2="15" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Assign Selected — streams flowing left into a channel -->
      <button class="quick-action-btn"
              (click)="assignSelected()"
              [disabled]="selectedStreamIds.size === 0 || selectedChannelIds.size !== 1"
              title="Assign Selected">
        <svg class="custom-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Channel (rounded rect on the left) -->
          <rect x="2" y="6" width="8" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
          <!-- Arrow pointing left (streams → channel) -->
          <path d="M14 12H21M14 12L17 9M14 12L17 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <!-- Stream bars on the right -->
          <line x1="19" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          <line x1="19" y1="17" x2="22" y2="17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </button>
    </div>

    <!-- Expanded state -->
    <div class="toolbar-content" *ngIf="toolbarExpanded">
      <div class="toolbar-header">
        <span class="toolbar-title">Actions</span>
        <button class="toggle-btn expanded-btn" (click)="toggleToolbar()">
          <span class="material-icons">chevron_left</span>
        </button>
      </div>

      <div class="toolbar-actions">
        <!-- Create Channel — custom SVG icon -->
        <button class="action-btn"
                (click)="openCreateChannelDialog()"
                title="Create Channel">
          <svg class="custom-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="9" y1="21" x2="15" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="18" x2="12" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="12" y1="8.5" x2="12" y2="14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="11.5" x2="15" y2="11.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- Assign Selected — custom SVG icon -->
        <button class="action-btn" (click)="assignSelected()" 
                [disabled]="selectedStreamIds.size === 0 || selectedChannelIds.size !== 1"
                title="Assign Selected">
          <svg class="custom-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="8" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M14 12H21M14 12L17 9M14 12L17 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="19" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
            <line x1="19" y1="17" x2="22" y2="17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          </svg>
        </button>
        <!-- Additional stubs can go here -->
      </div>
    </div>
  </div>

  <!-- RIGHT: Streams pane (independent catalog) -->
  <div class="pane right" [style.width.%]="100 - leftPaneWidth - (toolbarExpanded ? 10 : 0)">
    <app-streams-pane (selectionChange)="onStreamSelectionChange($event)"></app-streams-pane>
  </div>
</div>
