<div class="dialog-container">
  <h2>Create Channel</h2>
  
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-row">
      <div class="form-group flex-2">
        <label>Channel Name</label>
        <input type="text" formControlName="name" class="tui-input" placeholder="e.g. HBO HD" autocomplete="off">
        
        <div class="suggestions-dropdown" *ngIf="suggestions.length > 0">
          <div class="suggestion-item" *ngFor="let s of suggestions" (click)="selectSuggestion(s)">
            <span class="s-name">{{ s.name }}</span>
            <span class="s-callsign" *ngIf="s.call_sign">{{ s.call_sign }}</span>
          </div>
        </div>
      </div>
      <div class="form-group flex-1">
        <label>Channel #</label>
        <input type="number" formControlName="channel_number" class="tui-input" placeholder="Auto">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group flex-1">
        <label>Channel Group</label>
        <div class="flex-row gap-2" style="display: flex; gap: 8px;">
          <select formControlName="channel_group_id" class="tui-select" style="flex: 1;">
            <option [ngValue]="null">-- Select Group --</option>
            <option *ngFor="let g of groups" [ngValue]="g.id">{{ g.name }}</option>
          </select>
          <button type="button" class="btn-action" title="Add Group" (click)="addGroup()">+</button>
        </div>
      </div>
      <div class="form-group flex-1">
        <label>Stream Profile</label>
        <select formControlName="stream_profile_id" class="tui-select">
          <option [ngValue]="null">-- Default Profile --</option>
          <option *ngFor="let p of profiles" [ngValue]="p.id">{{ p.name }}</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group flex-1">
        <label>TVG-ID</label>
        <div class="flex-row gap-2" style="display: flex; gap: 8px;">
          <input type="text" formControlName="tvg_id" class="tui-input" style="flex: 1;" placeholder="e.g. HBO.us">
          <button type="button" class="btn-action" (click)="searchEpgData()" title="Search EPG">
            Search
          </button>
        </div>
      </div>
      <div class="form-group flex-1">
        <label>Gracenote Station ID</label>
        <div class="flex-row gap-2" style="display: flex; gap: 8px;">
          <input type="text" formControlName="tvc_guide_stationid" class="tui-input" style="flex: 1;" placeholder="e.g. 12345">
          <button type="button" class="btn-action" (click)="fetchLcn()" [disabled]="!form.get('tvg_id')?.value" title="Fetch LCN from EPG">
            Fetch
          </button>
        </div>
      </div>
    </div>

    <div class="form-group" style="margin-top: 16px;">
      <label>Channel Logo</label>
      <div class="logo-preview-row" style="display: flex; gap: 16px; align-items: flex-start; margin-top: 4px;">
        <div class="logo-preview-box" style="width: 80px; height: 80px; border: 1px solid #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: #111; overflow: hidden; flex-shrink: 0;">
          <img *ngIf="selectedLogoPreview" [src]="selectedLogoPreview" alt="Logo preview" (error)="onLogoError()" style="max-width: 100%; max-height: 100%; object-fit: contain;">
          <div *ngIf="!selectedLogoPreview" class="no-logo-placeholder" style="color: #666; font-size: 12px; text-align: center;">No Logo</div>
        </div>
        <div class="logo-controls" style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
          <div class="flex-row" style="display: flex; gap: 8px;">
            <input type="text" [formControl]="logoSearchControl" class="tui-input" style="flex: 1;" placeholder="Search logos...">
            <select formControlName="logo_id" class="tui-select" style="flex: 2;">
              <option [ngValue]="null">-- Select Logo --</option>
              <option *ngFor="let l of filteredLogos" [ngValue]="l.id">{{ l.name }}</option>
            </select>
          </div>
          <div class="flex-row" style="display: flex; gap: 8px;">
            <input type="text" [formControl]="newLogoUrlControl" class="tui-input" style="flex: 1;" placeholder="Image URL...">
            <button type="button" class="btn-action" (click)="addLogoFromUrl()" [disabled]="!newLogoUrlControl.value || addingLogo">
              {{ addingLogo ? 'Adding...' : 'Add from URL' }}
            </button>
            <input type="file" #fileInput hidden accept="image/*" (change)="uploadLogoFile($event)">
            <button type="button" class="btn-action" (click)="fileInput.click()" [disabled]="uploadingLogo">
              {{ uploadingLogo ? 'Uploading...' : 'Upload File' }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="form-row" style="display: flex; gap: 16px; margin-top: 16px; align-items: center;">
      <div class="form-group flex-1">
        <label>User Level Access</label>
        <select formControlName="user_level" class="tui-select">
          <option *ngFor="let level of userLevels" [ngValue]="level.id">{{ level.name }}</option>
        </select>
      </div>
      <div class="form-group flex-1 checkbox-row" style="margin-top: 24px;">
        <label class="checkbox-label" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" formControlName="is_adult">
          <span>Mature Content</span>
        </label>
      </div>
    </div>

    <div class="dialog-actions" style="margin-top: 24px;">
      <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
      <button type="submit" class="btn-submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Creating...' : 'Create Channel' }}
      </button>
    </div>
  </form>
</div>
