<div class="dialog-container">
  <div class="dialog-header">
    <div class="header-left">
       <span class="material-icons">list_alt</span>
       <h2>Channels</h2>
    </div>
    <button class="btn-close" (click)="cancel()">&times;</button>
  </div>
  
  <form [formGroup]="form" (ngSubmit)="submit()" class="modal-form">
    <div class="three-column-grid">
      
      <!-- Column 1: Basic Settings -->
      <div class="column">
        <div class="form-group">
          <div class="label-row">
            <label>Channel Name</label>
            <a class="shortcut-link" (click)="useEpgName()" *ngIf="selectedStation">Use EPG Name</a>
          </div>
          <div class="input-wrapper">
            <input type="text" formControlName="name" class="tui-input" placeholder="NFL Network" autocomplete="off">
            <div class="suggestions-dropdown" *ngIf="suggestions.length > 0">
              <div class="suggestion-item" *ngFor="let s of suggestions" (click)="selectSuggestion(s)">
                <span class="s-name">{{ s.name }}</span>
                <span class="s-callsign" *ngIf="s.call_sign">{{ s.call_sign }}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="form-group mt-3">
          <label>Channel Group</label>
          <div class="group-control">
            <select formControlName="channel_group_id" class="tui-select">
               <option [ngValue]="null">-- Select Group --</option>
               <option *ngFor="let g of filteredGroups" [ngValue]="g.id">{{ g.name }}</option>
            </select>
            <button type="button" class="btn-add-group" (click)="addGroup()">+</button>
          </div>
          <input type="text" [formControl]="groupSearchControl" class="tui-input search-sub" placeholder="Filter groups...">
        </div>

        <div class="form-group mt-3">
          <label>Stream Profile</label>
          <select formControlName="stream_profile_id" class="tui-select">
            <option [ngValue]="null">(use default)</option>
            <option *ngFor="let p of profiles" [ngValue]="p.id">{{ p.name }}</option>
          </select>
        </div>

        <div class="form-group mt-3">
          <label>User Level Access</label>
          <select formControlName="user_level" class="tui-select">
            <option *ngFor="let level of userLevels" [ngValue]="level.id">{{ level.name }}</option>
          </select>
        </div>
      </div>

      <!-- Column 2: Logo & Content -->
      <div class="column centered-col">
        <div class="form-group">
          <div class="label-row">
            <label>Logo</label>
            <a class="shortcut-link" (click)="useEpgLogo()" *ngIf="selectedStation?.logo_uri">Use EPG Logo</a>
          </div>
          <input type="text" [formControl]="logoSearchControl" class="tui-input" placeholder="Search logos...">
        </div>

        <div class="logo-preview-area mt-2">
          <img *ngIf="selectedLogoPreview" [src]="selectedLogoPreview" alt="Logo preview" (error)="onLogoError()">
          <div *ngIf="!selectedLogoPreview" class="no-logo">No Logo</div>
        </div>

        <button type="button" class="btn-upload mt-3" (click)="fileInput.click()">
           Upload or Create Logo
        </button>
        <input type="file" #fileInput hidden accept="image/*" (change)="uploadLogoFile($event)">

        <div class="mature-toggle mt-4">
           <label class="switch">
             <input type="checkbox" formControlName="is_adult">
             <span class="slider round"></span>
           </label>
           <span class="label-text">Mature Content</span>
        </div>
      </div>

      <!-- Column 3: EPG & IDs -->
      <div class="column">
        <div class="form-group">
          <label>Channel # (blank to auto-assign)</label>
          <input type="number" formControlName="channel_number" class="tui-input" placeholder="1">
        </div>

        <div class="form-group mt-3">
          <div class="label-row">
            <label>TVG-ID</label>
            <a class="shortcut-link" (click)="useEpgTvgId()" *ngIf="selectedStation">Use EPG TVG-ID</a>
          </div>
          <input type="text" formControlName="tvg_id" class="tui-input" placeholder="NFLHD">
        </div>

        <div class="form-group mt-3">
          <label>Gracenote StationId</label>
          <input type="text" formControlName="tvc_guide_stationid" class="tui-input" placeholder="45399">
        </div>

        <div class="form-group mt-3">
          <div class="label-row">
            <label>EPG</label>
            <div class="epg-actions">
               <a class="shortcut-link" (click)="useDummyEpg()">Use Dummy</a>
               <a class="shortcut-link match-link" (click)="autoMatchEpg()">
                 <span class="material-icons">bolt</span> Auto Match
               </a>
            </div>
          </div>
          <div class="epg-selection-box">
             <span class="selected-val">{{ selectedStation ? selectedStation.name : 'None selected' }}</span>
             <button type="button" class="btn-clear" (click)="clearEpg()" *ngIf="selectedStation">&times;</button>
          </div>
        </div>
      </div>

    </div>

    <div class="dialog-footer">
      <button type="submit" class="btn-submit" [disabled]="form.invalid || submitting">
        {{ submitting ? 'Submitting...' : 'Submit' }}
      </button>
    </div>
  </form>
</div>
