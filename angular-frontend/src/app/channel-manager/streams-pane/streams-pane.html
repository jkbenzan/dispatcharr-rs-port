<div class="pane-container">
  <div class="pane-header">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <h3>STREAMS</h3>
      <button 
        class="assign-btn" 
        [disabled]="selectedStreamIds.length === 0"
        (click)="onAssign()"
      >
        Assign ({{ selectedStreamIds.length }})
      </button>
    </div>
  </div>

  <div class="filters-bar">
    <input
      type="text"
      class="search-input"
      placeholder="Search streams..."
      [(ngModel)]="searchQuery"
      (ngModelChange)="onSearchChange($event)"
    />

    <div class="dropdowns">
      <select
        class="filter-select"
        [formControl]="providerControl"
        (change)="fetchStreams()"
      >
        <option value="">All Providers</option>
        <option *ngFor="let p of providers" [value]="p">{{ p }}</option>
      </select>

      <select
        class="filter-select"
        [formControl]="groupControl"
        (change)="fetchStreams()"
      >
        <option value="">All Groups</option>
        <option *ngFor="let g of groups" [value]="g">{{ g }}</option>
      </select>
    </div>
  </div>

  <tui-loader [overlay]="true" [loading]="loading">
    <div class="scroll-area">
      <tui-accordion [closeOthers]="false">
        <ng-container *ngFor="let group of streamGroups">
          <button tuiAccordion>
            <div class="group-header">
              <div style="display: flex; align-items: center; gap: 8px;">
                <input 
                  type="checkbox" 
                  [checked]="isGroupFullySelected(group)"
                  (click)="onToggleGroup(group, $event)"
                />
                <span>{{ group.name }}</span>
              </div>
              <span class="group-count">{{ group.streams.length }}</span>
            </div>
          </button>

          <div tuiItem>
            <div class="streams-list">
              <div
                *ngFor="let stream of group.streams"
                class="stream-item"
                (click)="onToggleStream(stream.id, $event)"
                draggable="true"
                (dragstart)="handleDragStart($event, stream)"
              >
                <input 
                  type="checkbox" 
                  [checked]="isStreamSelected(stream.id)"
                  style="margin-right: 12px; pointer-events: none;"
                />
                <div class="stream-info">
                  <span class="stream-name">{{ stream.name }}</span>
                  <span class="stream-details" *ngIf="stream.m3u_account_name">
                    {{ stream.m3u_account_name }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
      </tui-accordion>

      <div *ngIf="!loading && streamGroups.length === 0" class="empty-state">
        No streams found matching filters.
      </div>
    </div>
  </tui-loader>
</div>
