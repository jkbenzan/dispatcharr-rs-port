<div class="pane-container">
  <div class="pane-header">
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <h3 class="tui-text_h6">Channels ({{ totalCount }})</h3>
      <button tuiButton size="s" appearance="primary" (click)="showCreateDialog(createChannelTemplate)">
        + Create
      </button>
    </div>
  </div>

  <div class="search-bar">
    <tui-textfield>
      <input
        tuiTextfield
        type="text"
        placeholder="Search channels..."
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
      />
    </tui-textfield>
  </div>

  <tui-loader [overlay]="true" [loading]="loading">
    <div class="scroll-area">
      <div *ngIf="!loading && channels.length === 0" class="empty-state">
        No channels found.
      </div>

      <app-channel-list-item
        *ngFor="let channel of channels"
        [channel]="channel"
        [isSelected]="channel.id === selectedChannelId"
        (clicked)="onChannelClick(channel)"
        (itemDragOver)="handleDragOver($event)"
        (itemDrop)="handleDropNative($event, channel)"
      ></app-channel-list-item>
    </div>
  </tui-loader>

  <div class="pagination-bar" *ngIf="totalCount > 0">
    <button tuiButton size="s" appearance="flat" [disabled]="currentPage <= 1" (click)="prevPage()">
      ← Prev
    </button>
    <span class="page-info">Page {{ currentPage }}</span>
    <button tuiButton size="s" appearance="flat" [disabled]="!hasNextPage" (click)="nextPage()">
      Next →
    </button>
  </div>
</div>

<ng-template #createChannelTemplate let-observer>
  <form [formGroup]="createChannelForm" (ngSubmit)="submitCreateChannel(observer)">
    <h2 class="tui-text_h5" style="margin-bottom: 16px;">Create Channel</h2>
    
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <tui-textfield>
        <input tuiTextfield formControlName="name" placeholder="Channel Name" />
      </tui-textfield>

      <tui-textfield>
        <input tuiTextfield type="number" formControlName="channel_number" placeholder="Channel Number" />
      </tui-textfield>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
      <button tuiButton type="button" appearance="secondary" (click)="observer.complete()">
        Cancel
      </button>
      <button tuiButton type="submit" [disabled]="createChannelForm.invalid">
        Create
      </button>
    </div>
  </form>
</ng-template>
