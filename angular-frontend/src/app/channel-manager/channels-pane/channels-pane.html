<div class="pane-container">
  <div class="pane-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
    <h3 class="tui-text_h6">Channels</h3>
    <button class="tui-button tui-button_size_s" (click)="showCreateDialog(createChannelTemplate)">
      Create Channel
    </button>
  </div>

  <tui-loader [overlay]="true" [loading]="loading">
    <div class="scroll-area">
      <tui-accordion [closeOthers]="false">
        <ng-container *ngFor="let group of groups">
          <button
            tuiAccordion
            (click)="onGroupExpand(group)"
            class="group-btn"
          >
            <div class="group-header">
              <span>{{ group.name }}</span>
              <span class="tui-text_caption group-count">{{ group.channel_count }}</span>
            </div>
          </button>
          
          <div tuiItem>
            <tui-loader [loading]="!!group.loading">
              <div class="channels-list">
                <div *ngIf="group.channels?.length === 0" class="empty-state">
                  No channels in this group.
                </div>
                <app-channel-list-item
                  *ngFor="let channel of group.channels"
                  [channel]="channel"
                  [isSelected]="channel.id === selectedChannelId"
                  (clicked)="onChannelClick(channel)"
                  (itemDragOver)="handleDragOver($event)"
                  (itemDrop)="handleDropNative($event, channel)"
                ></app-channel-list-item>
              </div>
            </tui-loader>
          </div>
        </ng-container>
      </tui-accordion>
    </div>
  </tui-loader>
</div>

<ng-template #createChannelTemplate let-observer>
  <form [formGroup]="createChannelForm" (ngSubmit)="submitCreateChannel(observer)">
    <h2 class="tui-text_h5" style="margin-bottom: 16px;">Create Channel</h2>
    
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <tui-textfield>
        <input tuiTextfield formControlName="name" placeholder="Channel Name" />
      </tui-textfield>

      <tui-textfield>
        <input tuiTextfield type="number" formControlName="channel_number" placeholder="Channel Number" />
      </tui-textfield>

      <tui-select formControlName="group_id">
        Channel Group
        <tui-data-list-wrapper
          *tuiDataList
          [items]="groups"
          itemContent="name"
        ></tui-data-list-wrapper>
      </tui-select>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px;">
      <button tuiButton type="button" appearance="secondary" (click)="observer.complete()">
        Cancel
      </button>
      <button tuiButton type="submit" [disabled]="createChannelForm.invalid">
        Create
      </button>
    </div>
  </form>
</ng-template>
