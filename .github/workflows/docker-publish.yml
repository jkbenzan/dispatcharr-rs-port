name: Build and Push Docker Image

on:
  push:
    branches:
      - 'main'      # Triggers Prod build
      - 'develop'   # Triggers Dev build

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Note: Caching is used instead of --no-cache for faster builds
          platforms: linux/amd64
          # Conditional tagging logic
          tags: |
            ${{ github.ref == 'refs/heads/main' 
                && 'jbenzan/dispatcharr-rs-port:latest' 
                || 'jbenzan/dispatcharr-rs-port-dev:latest' }}
          # Enable high-speed caching with GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max
